services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chibatech_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # WHY: ホスト側からの `npm test` (packages/db の Prisma 統合テスト) と
      # `prisma migrate dev` が届く必要がある。LAN 非公開を維持するため
      # ループバックに束縛する (web の 127.0.0.1:3001 と同じ思想)。
      # WHY (host port): 既定は 5432。別プロジェクトと衝突する環境では .env の
      # POSTGRES_HOST_PORT で逃がせる (コンテナ内は常に 5432)。
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # WHY: `.env.test` が要求する chibatech_portal_test を初回起動時に追加作成する。
      # POSTGRES_DB は chibatech_portal しか作らないため、init SQL で test 用 DB を
      # 並列に作る。既存ボリューム再利用時は実行されないので手動 CREATE が必要。
      - ./packages/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # WHY: ホスト側のレートリミッタ/BullMQ がローカル開発で 6379 に届く必要がある。
      # LAN 非公開を維持するためループバックに束縛する。
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Web (Next.js) ---
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    ports:
      # WHY: Webだけローカル確認用に公開する。LAN公開と既存3000番競合を避ける
      - "127.0.0.1:3001:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/chibatech_portal
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    env_file:
      # WHY: .env は tracked されておらず初回 checkout 直後は存在しない。
      # `docker compose up postgres redis` だけ実行する経路 (test DB セットアップ)
      # でも compose parser はファイル存在を要求するため、optional 化する。
      # web/worker サービス起動時には .env が無くてもエラーにならず、
      # 必要な変数は environment セクション + シェル env から埋まる。
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # WHY: ホストのソースコードをマウントして HMR を有効にする
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next

  # --- Worker (BullMQ) ---
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/chibatech_portal
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      # WHY: スクレイピングは既定オフ。自分用に取り込む場合のみ true を渡す。
      - SCRAPE_ENABLED=${SCRAPE_ENABLED:-false}
    env_file:
      # WHY: .env は tracked されておらず初回 checkout 直後は存在しない。
      # `docker compose up postgres redis` だけ実行する経路 (test DB セットアップ)
      # でも compose parser はファイル存在を要求するため、optional 化する。
      # web/worker サービス起動時には .env が無くてもエラーにならず、
      # 必要な変数は environment セクション + シェル env から埋まる。
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/worker/node_modules

volumes:
  postgres_data:
  redis_data:
